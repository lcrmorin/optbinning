# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [master, develop, develop-sklearn]
  pull_request:
    branches: [master, develop]

env:
  SCIPY_ARRAY_API: "1"
  MPLBACKEND: Agg

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:

        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r test_requirements.txt
    - name: Install package
      run: |
        pip install -e .[distributed,test,ecos]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest

  sklearn-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sklearn: ["scikit-learn==1.6.1", "scikit-learn"]
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install compatibility dependencies
      run: python -m pip install -e ".[test,ecos]" "${{ matrix.sklearn }}"
    - name: Check sklearn protocols and weighted integration
      run: >-
        python -m pytest -q tests/test_estimator_checks.py
        tests/test_sklearn_integration.py tests/test_metadata_routing.py
        tests/test_feature_schema.py tests/test_target_policy.py
        tests/test_binning_process_sketch.py
        tests/test_continuous_weights.py tests/test_continuous_weight_routing.py
        tests/test_continuous_weight_constraints.py
